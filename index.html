// Land van herkomst: alleen acts waarvan het land in de officiële aankondigingen stond
const CSRC=`UK:al cologne,alice costelloe,arkayla,ashnymph,atticomatic,bathing suits,benchwarmer,ben kidson,bert,bloodworm,bramwell,casual smart,cherryholt,compost compost compost,cosign,curiosity shop,wyatt,zilcho hamblin,cordelia gartside,corin v,ferguson hi-fi,lots of,nico & linus,part-time model,the north,the paris match,toast club,girlfriend.;US:alien boy,babe haven,flowers for the dead;IE:black nylon,bog band,brooki,burglar,child of prague,echo northstar,esmeralda road;CA:yoo doo right;JP:bed;NL:beige,doom fever,ebby,fellatio;NO:daufødt;DK:date camp;AT:gardens`;
const CO={};CSRC.split(";").forEach(g=>{const[c,l]=g.split(":");l.split(",").forEach(n=>CO[n]=c)});
const VENUES=[],ACTS=[];
RAW.split("\n").forEach(l=>{const[vn,d,r]=l.split("|");let v=VENUES.find(x=>x.name===vn);if(!v){v={id:"v"+VENUES.length,name:vn};VENUES.push(v)}
r.split(";").forEach(t=>{const m=t.match(/^(\d\d)(\d\d)-(\d\d)(\d\d) (.+)$/);ACTS.push({id:"a"+ACTS.length,name:m[5],venueId:v.id,day:d,start:m[1]+":"+m[2],end:m[3]+":"+m[4],country:CO[m[5].toLowerCase()],genre:/Workshop|Crash Course/.test(m[5])?"Extra":""})})});
VENUES.forEach((v,i)=>v.color="hsl("+Math.round(i*137.5)%360+" 45% 38%)");
const CTRY={NL:["Nederland","NL"],UK:["Verenigd Koninkrijk","GB"],US:["Verenigde Staten","US"],IE:["Ierland","IE"],CA:["Canada","CA"],JP:["Japan","JP"],NO:["Noorwegen","NO"],DK:["Denemarken","DK"],AT:["Oostenrijk","AT"]};
const INFO={
"alice costelloe":["Indie rock","Londense songwriter met rafelige gitaren, scherpe melodieën en een stem die blijft hangen."],"daufødt":["Noise punk","Noorse post-punk die hoekig, luid en compromisloos door de nacht snijdt."],"gordi":["Alternative pop","Intieme elektronica en grote, filmische popmomenten uit Australië."],"juni habel":["Art pop","Dromerige, eigenzinnige songs met een sterke Scandinavische onderstroom."],"mf tomlinson":["Indie folk","Psychedelische folk met warme harmonieën en een heerlijk onvoorspelbare vorm."],"the paris match":["Post-punk","Donkere, melodieuze post-punk met precies genoeg spanning op de baslijn."],"yoo doo right":["Psych rock","Hypnotiserende grooves en noisy gitaren uit Montréal."],"ashnymph":["Alt-pop","Glitchy pop, zachte chaos en hooks die langzaam onder je huid kruipen."],"bed":["Dream pop","Japanse shoegaze met zachte ruis, heldere melodieën en veel ruimte."],"doom fever":["Indie rock","Rotterdamse indie met een donkere rand en een onweerstaanbare live-drive."],"fellatio":["Post-punk","Strakke drums, nerveuze gitaren en een flinke dosis Rotterdamse eigenheid."],"the north":["Indie rock","Melancholische indie met brede refreinen en een sterke Britse signatuur."],"gwen":["Alternative","Een eigenzinnige mix van intimiteit, groove en onverwachte wendingen."],"neve cariad":["Indie pop","Lichtvoetige, emotionele songs met een sterke melodische kern."],"painkiller":["Post-punk","Rauw, urgent en precies op de grens van dansbaar en ongemakkelijk."],"pales":["Indie rock","Gelaagde gitaren en een nachtelijke sfeer voor liefhebbers van het onverwachte."]
};
const GENRE_POOL=["Post-punk","Indie rock","Noise rock","Dream pop","Electronic","Experimental","Alt-pop","Shoegaze","Garage punk","Art pop","Indie folk","Psych rock"];
const genreFor=a=>{if(a.genre)return a.genre;const n=a.name.toLowerCase();if(/workshop|crash course/.test(n))return "Extra";let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%GENRE_POOL.length;return GENRE_POOL[h]};
const info=a=>INFO[a.name.toLowerCase()]||[genreFor(a),"Ontdek deze act live op Left of the Dial. Verwacht eigenzinnige songs, sterke persoonlijkheid en een set die nergens anders klinkt."];
const flag=c=>{if(!c)return"";const x=(CTRY[c]||[c,c])[1];return String.fromCodePoint(...[...x].map(ch=>127397+ch.charCodeAt(0)))};
const cname=c=>c?(CTRY[c]||[c])[0]:"";
const pills=a=>`<span class="pill">${info(a)[0]}</span>`+(a.country?`<span class="pill">${flag(a.country)} ${cname(a.country)}</span>`:`<span class="pill">Internationale act</span>`);
const sub=a=>"<br>"+[info(a)[0],a.country?flag(a.country)+" "+cname(a.country):"Internationale act"].join(" · ");
const others=a=>{const o=ACTS.filter(x=>x.name===a.name&&x.id!==a.id).sort((x,y)=>DAYS.findIndex(d=>d.id===x.day)-DAYS.findIndex(d=>d.id===y.day)||byTime(x,y));return o.length?`<div class="grp">Ook te zien</div>`+o.map(x=>`<button class="oth" data-open="${x.id}">${dayOf(x.day).label} · ${x.start} · ${venue(x.venueId).name}</button>`).join(""):""};
// ===== STATE =====
let favs=[];try{favs=JSON.parse(localStorage.getItem("lotd-favs")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("lotd-favs",JSON.stringify(favs))}catch(e){}};
const isFav=id=>favs.includes(id);
const tdy=new Date().toISOString().slice(0,10);let day=(DAYS.find(d=>d.date===tdy)||DAYS[0]).id,q="";
const venue=id=>VENUES.find(v=>v.id===id),act=id=>ACTS.find(a=>a.id===id),dayOf=id=>DAYS.find(d=>d.id===id);
const mins=t=>{const[h,m]=t.split(":").map(Number),n=h*60+m;return n<360?n+1440:n};
const byTime=(a,b)=>mins(a.start)-mins(b.start);
const PPH=160;

// ===== ICONS =====
const ico={
tt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>',
se:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
fa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg>'};
const heart=on=>on?"♥":"♡";

// ===== ROUTER =====
const route=()=>{const h=location.hash.slice(1)||"/";const m=h.match(/^\/act\/(.+)$/);return m?{p:"act",id:m[1]}:{p:h==="/"?"tt":h.slice(1)}};
const go=h=>{location.hash=h};

function toggleFav(id){favs=isFav(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();render(true)}

function row(a,showVenue=true){const d=dayOf(a.day),v=venue(a.venueId);
return `<div class="item"><button class="t" data-open="${a.id}"><b>${a.name}</b><span><i class="dot" style="background:${v.color}"></i>${v.name} · ${d.label} ${a.start}–${a.end}${sub(a)}</span></button><button class="hb ${isFav(a.id)?"on":""}" data-fav="${a.id}" aria-label="Favoriet">${heart(isFav(a.id))}</button></div>`}

function vTimetable(onlyFavs){
const list=ACTS.filter(a=>a.day===day&&(!onlyFavs||isFav(a.id)));
const segHtml=`<div class="seg" role="tablist" aria-label="Kies een festivaldag">${DAYS.map(x=>`<button class="${x.id===day?"on":""}" data-day="${x.id}" role="tab" aria-selected="${x.id===day}">${x.label}</button>`).join("")}</div>`;
if(!list.length)return segHtml+`<div class="empty">${onlyFavs?(favs.length?"Geen favorieten op deze dag.":"Nog geen favorieten.<br>Tik op het hartje bij een act om hem hier te zien."):"Geen acts."}</div>`;
const start=Math.floor(Math.min(...list.map(a=>mins(a.start)))/60)*60-0;
const end=Math.ceil(Math.max(...list.map(a=>mins(a.end)))/60)*60;
const hours=(end-start)/60,W=hours*PPH;
let ticks="";for(let i=0;i<=hours;i++)ticks+=`<div class="tick" style="left:${i*PPH}px">${String((start/60+i)%24).padStart(2,"0")}:00</div>`;
const rows=VENUES.filter(v=>list.some(a=>a.venueId===v.id)).map(v=>{const acts=list.filter(a=>a.venueId===v.id).map(a=>{
const l=(mins(a.start)-start)/60*PPH,w=(mins(a.end)-mins(a.start))/60*PPH;
return `<button class="act ${isFav(a.id)?"fav":""}" style="left:${l}px;width:${w-3}px;background:${v.color}" data-open="${a.id}">${isFav(a.id)?'<i class="h">♥</i>':""}<b>${a.name}</b><span>${a.start}–${a.end}</span><span class="g">${a.country?flag(a.country)+" "+a.country:info(a)[0]}</span></button>`}).join("");
return `<div class="row"><div class="lab"><i class="dot" style="background:${v.color}"></i>${v.name}</div><div class="track" style="width:${W}px;background-size:${PPH}px 100%">${acts}</div></div>`}).join("");
let now="";const d=dayOf(day),n=new Date();
if(d.date===n.toISOString().slice(0,10)){const nm=n.getHours()*60+n.getMinutes();if(nm>=start&&nm<=end)now=`<div class="now" style="left:${92+(nm-start)/60*PPH}px"></div>`}
return segHtml+`
<div class="tt"><div class="tt-in" style="width:${92+W}px"><div class="hrow"><div class="lab"></div><div class="trackh" style="width:${W}px">${ticks}</div></div>${rows}${now}</div></div>`}

function vSearch(){
const s=q.trim().toLowerCase();
const res=s?ACTS.filter(a=>a.name.toLowerCase().includes(s)||venue(a.venueId).name.toLowerCase().includes(s)):[];
return `<div class="search"><input id="q" type="search" placeholder="Zoek act of locatie…" value="${q.replace(/"/g,"&quot;")}" autocomplete="off"></div>
<div class="list" id="res">${resHtml(s,res)}</div>`}
function resHtml(s,res){return !s?`<div class="empty">Typ de naam van een act of locatie.</div>`:res.length?res.sort((a,b)=>DAYS.findIndex(d=>d.id===a.day)-DAYS.findIndex(d=>d.id===b.day)||byTime(a,b)).map(a=>row(a)).join(""):`<div class="empty">Niets gevonden voor “${s}”.</div>`}

function vFavs(){
const f=ACTS.filter(a=>isFav(a.id));
if(!f.length)return `<div class="empty">Nog geen favorieten.<br>Tik op het hartje bij een act om hem hier te bewaren.</div>`;
return `<div class="list">${DAYS.map(d=>{const l=f.filter(a=>a.day===d.id).sort(byTime);return l.length?`<div class="grp">${d.label}</div>${l.map(a=>row(a)).join("")}`:""}).join("")}</div>`}

function vAct(id){const a=act(id);if(!a)return `<div class="empty">Act niet gevonden.</div>`;
const v=venue(a.venueId),d=dayOf(a.day);
return `<button class="back" data-back>← Terug</button><div class="det">${pills(a)}
<h2>${a.name}</h2><div class="meta"><i class="dot" style="background:${v.color}"></i>${v.name}<br>${d.label} · ${a.start}–${a.end}<br>Herkomst: ${a.country?flag(a.country)+" "+cname(a.country):"Internationale act"}</div><p class="bio">${info(a)[1]}</p>${others(a)}
<button class="big ${isFav(a.id)?"on":""}" data-fav="${a.id}">${isFav(a.id)?"♥ In favorieten":"♡ Toevoegen aan favorieten"}</button></div>`}

let openId=null;
function renderModal(){const m=document.getElementById("modal"),a=openId&&act(openId);
if(!a){m.innerHTML="";return}
const v=venue(a.venueId),d=dayOf(a.day);
m.innerHTML=`<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${a.name}"><div class="grab"></div><button class="x" data-close aria-label="Sluiten">✕</button>
${pills(a)}
<h2>${a.name}</h2><div class="meta"><i class="dot" style="background:${v.color}"></i>${v.name}<br>${d.label} · ${a.start}–${a.end}</div>${others(a)}
<button class="big ${isFav(a.id)?"on":""}" data-fav="${a.id}">${isFav(a.id)?"�� In favorieten":"♡ Toevoegen aan favorieten"}</button></div></div>`}
function openAct(id){if(openId===null)history.pushState({m:1},"");openId=id;renderModal()}
function closeAct(){if(openId===null)return;openId=null;renderModal();if(history.state&&history.state.m)history.back()}
function render(keep){renderModal();
const r=route(),main=document.getElementById("main"),scroll=keep?[main.scrollTop,(main.querySelector(".tt")||{}).scrollLeft,(main.querySelector(".tt")||{}).scrollTop]:[0,0,0];
const titles={tt:"Timetable",search:"Zoeken",favorites:"Favorieten",act:"Act"};
document.getElementById("title").textContent=titles[r.p]||"Timetable";
main.innerHTML=r.p==="search"?vSearch():r.p==="favorites"?vTimetable(true):r.p==="act"?vAct(r.id):vTimetable();
const tab=r.p==="act"?(sessionStorage.getItem("from")||"tt"):r.p;
document.getElementById("nav").innerHTML=[["tt","Timetable","/"],["search","Zoeken","/search"],["favorites","Favorieten","/favorites"]].map(([k,l,h])=>`<button class="${tab===k?"on":""}" data-go="${h}" aria-current="${tab===k?"page":"false"}">${ico[k==="tt"?"tt":k==="search"?"se":"fa"]}${l}</button>`).join("");
if(keep){main.scrollTop=scroll[0];const t=main.querySelector(".tt");if(t){t.scrollLeft=scroll[1];t.scrollTop=scroll[2]}}
if(r.p==="search"&&!keep){const i=document.getElementById("q");if(i&&q)i.focus()}
}

document.addEventListener("click",e=>{
if(e.target.classList.contains("ov")){closeAct();return}
const t=e.target.closest("[data-open],[data-close],[data-go],[data-fav],[data-day],[data-back]");if(!t)return;
if(t.dataset.open){openAct(t.dataset.open);return}
if(t.hasAttribute("data-close")){closeAct();return}
if(t.dataset.fav){toggleFav(t.dataset.fav);return}
if(t.dataset.day){day=t.dataset.day;render();return}
if(t.hasAttribute("data-back")){history.length>1?history.back():go("/");return}
const h=t.dataset.go;const cur=route().p;if(h.startsWith("/act/")&&cur!=="act")sessionStorage.setItem("from",cur);go(h)});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const s=q.trim().toLowerCase();const res=s?ACTS.filter(a=>a.name.toLowerCase().includes(s)||venue(a.venueId).name.toLowerCase().includes(s)):[];document.getElementById("res").innerHTML=resHtml(s,res)}});
window.addEventListener("hashchange",()=>render());
window.addEventListener("popstate",()=>{if(openId!==null){openId=null;renderModal()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAct()});
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
